<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Directores Agrupados · Portal de comunicación de obras</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;0,9..144,800;1,9..144,300&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
/* ===============================================================
   Directores Agrupados — Portal de comunicación
   Estilo institucional moderno · navy + lime
   =============================================================== */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #f4f6fb; color: #0e1837; font-family: "Inter", system-ui, sans-serif; line-height: 1.5; }
body { scroll-behavior: smooth; }

:root {
  --navy:        #1a2a5e;
  --navy-deep:   #0e1837;
  --navy-soft:   #2a3a6e;
  --lime:        #c5e230;
  --lime-deep:   #afca21;
  --ink:         #0e1837;
  --muted:       #6c7088;
  --rule:        #e7e9ee;
  --rule-soft:   #f0f1f5;
  --bg:          #f4f6fb;
  --bg-alt:      #fafbfc;
  --bg-cream:    #f8f9fc;
  --warning-bg:  #fff8db;
  --warning-bd:  #ecdc8c;
  --warning-fg:  #6b6850;
}

.wrap { max-width: 1600px; margin: 0 auto; padding: 0 48px; }
.mono { font-family: "JetBrains Mono", monospace; }

/* ===============================================================
  1. NAV
  =============================================================== */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: var(--navy); color: white;
  padding: 0 48px; height: 72px;
  display: flex; align-items: center;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.nav .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.nav .logo-mark {
  width: 32px; height: 32px;
  background: var(--lime);
  display: grid; place-items: center;
  color: var(--navy); font-weight: 800; font-size: 15px;
  border-radius: 5px;
  position: relative;
}
.nav .logo-mark::after {
  content: ""; position: absolute; right: -3px; bottom: -3px;
  width: 10px; height: 10px; background: var(--navy);
  border: 2px solid var(--lime); border-radius: 2px;
}
.nav .logo-text { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; line-height: 1.1; font-family: "Fraunces", Georgia, serif; }
.nav .logo-text .crumb {
  font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
  color: rgba(255,255,255,0.55); font-weight: 500; margin-top: 2px;
}
.nav .links {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; justify-content: center; gap: 4px;
}
.nav .links a {
  padding: 8px 14px; font-size: 14px; color: rgba(255,255,255,0.78);
  text-decoration: none; cursor: pointer; font-weight: 500;
  border-radius: 4px; transition: all 0.15s ease;
}
.nav .links button {
  appearance: none; border: 0; background: transparent;
  padding: 8px 14px; font-size: 14px; color: rgba(255,255,255,0.78);
  cursor: pointer; font-weight: 500; font-family: inherit;
  border-radius: 4px; transition: all 0.15s ease;
}
.nav .links a:hover { color: white; background: rgba(255,255,255,0.06); }
.nav .links button:hover { color: white; background: rgba(255,255,255,0.06); }
.nav .links a.on { color: var(--lime); }
.nav .links button.on { color: var(--lime); }
.nav .right { margin-left: auto; display: flex; align-items: center; }
.nav .contact-pill {
  appearance: none; border: 1px solid rgba(197,226,48,0.38); background: transparent;
  color: var(--lime); padding: 8px 14px; border-radius: 999px;
  font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  transition: all 0.15s ease;
}
.nav .contact-pill:hover { background: rgba(197,226,48,0.08); border-color: var(--lime); }

/* ===============================================================
   2. HERO
   =============================================================== */
.hero {
  background: linear-gradient(135deg, #0e1837 0%, #1a2a5e 60%, #1e3470 100%);
  color: white;
  min-height: calc(100vh - 72px);
  padding: 120px 0 160px;
  position: relative;
  overflow: hidden;
}
.hero .grid-overlay {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 48px 48px; pointer-events: none;
}
.hero .glow {
  position: absolute; top: -10%; right: -8%;
  width: 700px; height: 700px;
  background: radial-gradient(circle at center, rgba(197,226,48,0.10) 0%, transparent 60%);
  pointer-events: none;
}
.hero .inner { position: relative; z-index: 1; }
.hero .inner {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 72px - 252px);
}
.hero .hero-min {
  max-width: 860px;
  text-align: center;
}
.hero .eyebrow {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--lime); font-weight: 600; margin-bottom: 24px;
  display: inline-flex; align-items: center; gap: 14px;
  background: rgba(197,226,48,0.08); padding: 8px 14px;
  border: 1px solid rgba(197,226,48,0.18); border-radius: 999px;
}
.hero .eyebrow .dot { width: 6px; height: 6px; background: var(--lime); border-radius: 50%; }
.hero h1 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 88px; line-height: 0.95; letter-spacing: -0.04em;
  font-weight: 800; margin: 0 0 24px; max-width: 1000px;
  color: white;
  text-wrap: balance;
}
.hero h1 .accent { color: var(--lime); }
.hero-badges {
  display: flex; justify-content: center; gap: 12px; margin-bottom: 24px;
  flex-wrap: wrap;
}
.hero-badge {
  background: rgba(197,226,48,0.12); border: 1px solid rgba(197,226,48,0.3);
  color: white; padding: 8px 16px; border-radius: 6px;
  font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 600;
  letter-spacing: 0.06em;
}
.hero .lede {
  font-size: 18px; color: rgba(255,255,255,0.78); max-width: 680px;
  margin: 0 auto 32px; line-height: 1.55;
}
.hero-actions { display: flex; justify-content: center; margin-bottom: 28px; }
.hero-cta {
  appearance: none; border: 1px solid rgba(197,226,48,0.5); background: rgba(197,226,48,0.08);
  color: var(--lime); padding: 12px 20px; border-radius: 999px;
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  transition: all 0.15s ease;
}
.hero-cta:hover { background: rgba(197,226,48,0.14); border-color: var(--lime); }
.hero-team {
  margin-bottom: 18px;
  display: flex; justify-content: center; align-items: baseline; gap: 10px; flex-wrap: wrap;
  color: rgba(255,255,255,0.68); font-size: 12px; line-height: 1.45;
}
.hero-team span {
  text-transform: uppercase; letter-spacing: 0.14em; color: rgba(255,255,255,0.42);
  font-size: 10px; font-weight: 600;
}
.hero-team .names { max-width: 920px; }
.hero-meta {
  display: flex; justify-content: center; gap: 28px; flex-wrap: wrap;
  font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase;
  color: rgba(255,255,255,0.52);
}
.hero-meta span { position: relative; }
.hero-meta span + span::before {
  content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
  width: 1px; height: 12px; background: rgba(255,255,255,0.14);
}

/* ===============================================================
   3. INTRODUCCIÓN
   =============================================================== */
.intro {
  padding: 96px 0;
  border-bottom: 0;
  background: var(--bg);
}
.intro .grid {
  display: grid; grid-template-columns: 280px 1fr 320px;
  gap: 80px; align-items: start;
}
.intro .label {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin-bottom: 14px;
}
.intro h2 {
  font-size: 16px; line-height: 1.4; letter-spacing: 0; color: var(--navy);
  font-weight: 600; margin: 0;
}
.intro .body p {
  font-size: 22px; line-height: 1.5; color: var(--ink);
  margin: 0 0 20px; letter-spacing: -0.005em;
}
.intro .body p:last-child { margin-bottom: 0; }
.intro .body p .lime {
  background: linear-gradient(180deg, transparent 65%, rgba(197,226,48,0.55) 65%);
  padding: 0 2px;
}
.intro .body .signature {
  margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule);
  display: flex; align-items: center; gap: 16px;
  font-size: 13px; color: var(--muted);
}
.intro .body .signature .mark {
  width: 28px; height: 28px; background: var(--lime); border-radius: 4px;
  display: grid; place-items: center; color: var(--navy); font-weight: 800; font-size: 13px;
}
.intro .aside {
  background: var(--bg-cream); border: 1px solid var(--rule);
  border-radius: 8px; padding: 28px;
}
.intro .aside h4 {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin: 0 0 16px;
}
.intro .aside ul { list-style: none; padding: 0; margin: 0; }
.intro .aside li {
  padding: 10px 0; border-bottom: 1px solid var(--rule-soft);
  font-size: 14px; color: var(--ink);
  display: flex; align-items: flex-start; gap: 12px;
}
.intro .aside li:last-child { border-bottom: 0; }
.intro .aside li::before {
  content: ""; flex-shrink: 0; width: 14px; height: 2px;
  background: var(--navy); margin-top: 10px;
}

/* ===============================================================
   4. TABS — sticky project switcher
   =============================================================== */
.tabs-wrap {
  position: sticky;
  top: 72px;
  z-index: 50;
  background: var(--bg);
  backdrop-filter: none;
  border-bottom: 0;
  margin-top: 40px;
}
.projects-carousel {
  display: flex;
  gap: 14px;
  overflow-x: auto;
  overflow-y: hidden;
  align-items: center;
  justify-content: center;
  padding: 12px 0 16px;
  scrollbar-width: none;
}
.projects-carousel::-webkit-scrollbar { display:none; }
.project-card {
  width: 350px;
  min-width: 350px;
  max-width: 350px;
  background: white; border: 1px solid rgba(14,24,55,0.08); border-radius: 14px;
  padding: 16px; display: flex; gap: 14px; align-items: center; cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  box-shadow: 0 2px 8px rgba(14,24,55,0.04);
}
.project-card:hover { transform: translateY(-5px); box-shadow: 0 16px 36px rgba(10,20,50,0.08); }
.project-card.on { border-color: rgba(197,226,48,0.95); background: linear-gradient(180deg, #ffffff 0%, rgba(197,226,48,0.08) 100%); box-shadow: 0 18px 42px rgba(197,226,48,0.16); transform: translateY(-4px) scale(1.01); }
.project-thumb { width: 76px; height: 60px; border-radius: 10px; background: linear-gradient(135deg, rgba(26,42,94,0.08), rgba(197,226,48,0.18)); display:grid; place-items:center; font-weight:800; color:var(--navy); font-family: "JetBrains Mono", monospace; }
.project-info { display:flex; flex-direction:column; }
.project-info .short { font-weight:800; color:var(--navy); font-size:15px; line-height:1.2; }
.project-info .loc { font-size:12px; color:var(--muted); margin-top:3px; }

/* ===============================================================
   ALERT BAR — sits at top of project area
   =============================================================== */
.alert {
  background: var(--warning-bg);
  border-bottom: 1px solid var(--warning-bd);
  padding: 14px 48px;
  display: flex; align-items: center; gap: 16px;
  font-size: 14px;
}
.alert .pulse {
  width: 8px; height: 8px; border-radius: 50%;
  background: #d97706; flex-shrink: 0;
  animation: alertPulse 2s infinite;
}
@keyframes alertPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
.alert .tag {
  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
  background: var(--navy); color: var(--lime); padding: 4px 9px; border-radius: 3px;
}
.alert .headline { font-weight: 600; color: var(--ink); }
.alert .when { color: var(--warning-fg); }
.alert .detail { color: var(--warning-fg); margin-left: auto; }
.alert .nav-dots { display: flex; gap: 6px; }
.alert .nav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(0,0,0,0.2); cursor: pointer; border: 0; padding: 0;
  transition: all 0.15s ease;
}
.alert .nav-dot.on { background: var(--navy); width: 18px; border-radius: 3px; }

/* ===============================================================
   GENERIC SECTION
   =============================================================== */
.section { padding: 124px 0; border-bottom: 0; }
.section.alt { background: transparent; }
.section.navy { background: var(--navy); color: white; }

.section-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; max-width: 800px; }
.section-head .desc { padding-top: 0; max-width: 720px; }
.section-head .left .eyebrow {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--lime-deep); font-weight: 700;
}
.section.navy .section-head .left .eyebrow { color: var(--lime); }
.section-head .left h2 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 52px; line-height: 1.0; letter-spacing: -0.02em;
  font-weight: 700; margin: 10px 0 0; color: var(--ink);
  text-wrap: balance;
}
.section.navy .section-head .left h2 { color: white; }
.section-head .desc {
  color: var(--muted); font-size: 17px; line-height: 1.55; padding-top: 14px;
  max-width: 620px;
}
.section.navy .section-head .desc { color: rgba(255,255,255,0.75); }

/* ===============================================================
  5. EL PROYECTO
  =============================================================== */
.proj-hero {
  display: grid; grid-template-columns: 1fr 1fr; gap: 64px;
  margin-bottom: 56px;
}
.proj-hero .text .crumb {
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--muted); letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.proj-hero .text .crumb .pill {
  background: var(--lime); color: var(--navy);
  padding: 3px 9px; border-radius: 3px; font-weight: 700;
  letter-spacing: 0.12em; font-size: 11px;
}
.proj-hero .text h3 {
  font-family: "Fraunces", Georgia, serif;
  font-size: 52px; line-height: 1.0; letter-spacing: -0.025em;
  font-weight: 700; margin: 0 0 20px; color: var(--ink);
}
.proj-hero .text .summary {
  font-size: 17px; line-height: 1.55; color: var(--ink);
  max-width: 560px;
}
.proj-hero .visual {
  background: var(--bg-cream); border: 1px solid var(--rule);
  border-radius: 8px; min-height: 360px; overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}
/* Photo gallery inside project visual */
.photo-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px; width: 100%;
}
.photo-zone {
  background: linear-gradient(180deg, #f8fafc, #ffffff); border: 1px dashed var(--rule); border-radius: 8px;
  min-height: 140px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
  cursor: pointer; transition: box-shadow 0.18s ease, transform 0.18s ease;
}
.photo-zone:hover { box-shadow: 0 10px 30px rgba(10,20,50,0.06); transform: translateY(-4px); }
.photo-zone img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-zone .add { font-size: 14px; color: var(--muted); font-weight: 700; }

/* ── VIDEO THUMBNAIL + LIGHTBOX ── */
.video-thumb-wrap {
  position: relative; cursor: pointer;
  border-radius: 12px; overflow: hidden;
  background: #000;
  aspect-ratio: 16/9;
  border: 2px solid rgba(197,226,48,0.2);
  transition: border-color 0.2s, transform 0.2s;
}
.video-thumb-wrap:hover { border-color: var(--lime); transform: translateY(-3px); }
.video-thumb-wrap video {
  width: 100%; height: 100%; object-fit: cover;
  pointer-events: none; opacity: 0.7;
}
.video-play-btn {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 8px;
}
.video-play-icon {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(197,226,48,0.9);
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s, background 0.2s;
}
.video-thumb-wrap:hover .video-play-icon { transform: scale(1.1); background: var(--lime); }
.video-play-icon svg { width: 28px; height: 28px; fill: #1a2a5e; margin-left: 4px; }
.video-play-label { color: white; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }

/* LIGHTBOX */
.lightbox-overlay {
  position: fixed; inset: 0; z-index: 999;
  background: rgba(5,10,25,0.92);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  backdrop-filter: blur(6px);
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}
.lightbox-inner {
  position: relative; width: 100%; max-width: 1100px;
  background: #000; border-radius: 12px; overflow: hidden;
  box-shadow: 0 40px 120px rgba(0,0,0,0.8);
  animation: scaleIn 0.2s ease;
}
@keyframes scaleIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.lightbox-inner video { width: 100%; display: block; max-height: 80vh; }
.lightbox-close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); border: none;
  color: white; font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  font-family: inherit;
}
.lightbox-close:hover { background: rgba(255,255,255,0.3); }
.lightbox-title {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  color: white; padding: 32px 20px 16px;
  font-size: 14px; font-weight: 600; letter-spacing: 0.04em;
}
.videos-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
  margin-bottom: 8px;
}
.photo-input { display: none; }

.proj-hero .visual .label {
  position: absolute; top: 20px; left: 20px;
  font-family: "JetBrains Mono", monospace; font-size: 11px;
  letter-spacing: 0.14em; color: var(--muted);
  background: rgba(255,255,255,0.85); padding: 5px 10px; border-radius: 3px;
  z-index: 2;
}
.proj-hero .visual .placeholder-bg {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(
      135deg,
      #f4f5f9 0px, #f4f5f9 14px,
      #e7e9ee 14px, #e7e9ee 15px
    );
  opacity: 0.7;
}
.proj-hero .visual .placeholder-text {
  position: relative; z-index: 1; margin: auto;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase;
  background: white; padding: 14px 22px; border: 1px solid var(--rule);
  border-radius: 4px;
}
.proj-hero .visual .corner-meta {
  position: absolute; bottom: 20px; left: 20px;
  font-family: "JetBrains Mono", monospace; font-size: 10px;
  color: var(--muted); letter-spacing: 0.1em;
  background: rgba(255,255,255,0.85); padding: 5px 10px; border-radius: 3px;
  z-index: 2;
}

.proj-stats {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 32px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  padding: 44px 0; margin-bottom: 80px;
}
.proj-stat .v {
  font-family: "Fraunces", Georgia, serif;
  font-size: 64px; font-weight: 700; letter-spacing: -0.03em;
  color: var(--navy); line-height: 1; display: flex; align-items: baseline; gap: 6px;
}
.proj-stat .v .u { font-size: 18px; font-weight: 500; color: var(--muted); }
.proj-stat .bar { height: 2px; background: var(--lime); width: 28px; margin-top: 12px; }
.proj-stat .l {
  font-size: 14px; color: var(--muted); margin-top: 12px;
  line-height: 1.45; max-width: 200px;
}

/* Ficha técnica + actuaciones grid */
.proj-detail {
  display: grid; grid-template-columns: 1fr 1fr; gap: 56px;
  margin-bottom: 80px;
}
.proj-block .h4 {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600; margin-bottom: 20px;
}
.proj-block h3 {
  font-size: 24px; font-weight: 700; letter-spacing: -0.015em;
  margin: 0 0 24px; color: var(--ink);
}
.sheet-rows { border-top: 1px solid var(--rule); }
.sheet-rows .row {
  display: grid; grid-template-columns: 200px 1fr;
  padding: 16px 0; border-bottom: 1px solid var(--rule-soft);
  align-items: baseline; gap: 24px;
}
.sheet-rows .k {
  font-size: 13px; letter-spacing: 0.06em; color: var(--muted);
  text-transform: uppercase; font-weight: 600;
}
.sheet-rows .v { font-size: 16px; color: var(--ink); font-weight: 500; }

.acts-list { display: flex; flex-direction: column; gap: 12px; }
.act-row {
  background: white; border: 1px solid var(--rule);
  padding: 22px 24px; border-radius: 6px;
  display: grid; grid-template-columns: 40px 1fr; gap: 18px;
  align-items: start; transition: all 0.2s ease;
}
.act-row:hover { border-color: var(--lime); box-shadow: 0 4px 16px rgba(197,226,48,0.15); transform: translateX(4px); }
.act-row .marker {
  background: var(--navy); color: var(--lime);
  width: 36px; height: 36px; border-radius: 4px;
  display: grid; place-items: center;
  font-family: "JetBrains Mono", monospace; font-size: 12px;
  font-weight: 700; letter-spacing: 0.06em;
}
.act-row h4 { font-size: 18px; font-weight: 700; margin: 0 0 6px; color: var(--ink); }
.act-row p { font-size: 15px; color: var(--muted); line-height: 1.55; margin: 0; }

/* Timeline */
.timeline {
  position: relative; padding-left: 40px;
  border-top: 1px solid var(--rule); padding-top: 32px;
}
.timeline::before {
  content: ""; position: absolute; left: 6px; top: 40px; bottom: 8px;
  width: 2px; background: var(--rule);
}
.tl-row {
  display: grid; grid-template-columns: 140px 1fr;
  gap: 32px; padding: 12px 0; position: relative;
  align-items: center;
}
.tl-row::before {
  content: ""; position: absolute; left: -40px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px; border-radius: 50%;
  background: white; border: 2px solid var(--rule);
}
.tl-row.done::before { background: var(--navy); border-color: var(--navy); }
.tl-row.active::before {
  background: var(--lime); border-color: var(--lime);
  box-shadow: 0 0 0 4px rgba(197,226,48,0.25);
}
.tl-row .date {
  font-family: "JetBrains Mono", monospace; font-size: 13px;
  color: var(--muted); font-weight: 500;
}
.tl-row.done .date { color: var(--navy); }
.tl-row.active .date { color: var(--navy); font-weight: 700; }
.tl-row .lbl { font-size: 15px; color: var(--ink); }
.tl-row.active .lbl { font-weight: 600; }
.tl-row.pending .lbl { color: var(--muted); }

.stk-matrix-wrapper {
  margin-top: 18px;
  overflow: visible;
  position: relative;
  width: 100%;
}
.stk-grid-matrix {
  display: grid;
  grid-template-columns: 60px repeat(10, 1fr);
  grid-auto-rows: 36px;
  gap: 0;
  border: 1px solid var(--rule);
  border-radius: 6px;
  overflow: visible;
  background: white;
}
.stk-grid-corner {
  background: var(--navy);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-family: "JetBrains Mono", monospace; font-weight: 700;

  background: var(--bg-cream);

.stk-grid-head.row { background: var(--bg-cream); }
.stk-grid-cell {

  display: flex; align-items: center; justify-content: center;
  min-height: 36px;
  position: relative;
}

.stk-grid-cell.strat-high { background: rgba(197,226,48,0.3); }
.stk-grid-cell.strat-midhigh { background: rgba(255,220,102,0.3); }
.stk-grid-cell.strat-neutral { background: rgba(179,212,255,0.3); }

.stk-cell-items { display: flex; gap: 6px; padding: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }

  margin-top: 16px;
  display: grid;

.stk-legend .sw.strat-midhigh { background: rgba(255,220,102,0.3); }

.stk-matrix-wrapper { position: relative; padding-left: 48px; }
.stk-grid-label {
  position: absolute; color: var(--muted); font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; font-size: 12px;
}
.stk-grid-label-x {
  top: -26px; left: 50%; transform: translateX(-50%);
}
.stk-grid-label-y {
  left: -48px; top: 50%; transform: translateY(-50%) rotate(-90deg);

.stk-badge { background: var(--navy); color: white; }
.stk-badge.high, .stk-badge.midhigh, .stk-badge.low, .stk-badge.neutral { background: var(--navy); color: white; }

  /* ── LIGHTBOX ── */
  function VideoLightbox({ src, title, onClose }) {
    const videoRef = React.useRef();
    React.useEffect(() => {
      if (videoRef.current) videoRef.current.play();
      function onKey(e) { if (e.key === 'Escape') onClose(); }
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);
    return (
      <div className="lightbox-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
        <div className="lightbox-inner">
          <video ref={videoRef} src={src} controls autoPlay style={{width:'100%',display:'block',maxHeight:'80vh'}} />
          <div className="lightbox-title">{title}</div>
          <button className="lightbox-close" onClick={onClose}>✕</button>
        </div>

  /* ── GRUPOS DE INTERÉS + MATRIZ ── */
  function GruposInteres({ p }) {
    const stakes = D.stakeholders[p.id];
    const gridSize = 10;
    const getCode = (s) => s.code;
    const stratClass = (strategy) => {
      if (strategy === "Gestionar atentamente") return "strat-high";
      if (strategy === "Mantener satisfecho") return "strat-midhigh";
      if (strategy === "Mantener informado") return "strat-neutral";
      return "strat-low";
    };
    const getCellStakes = (power, interest) => stakes.filter(s => Math.round(s.power) === power && Math.round(s.interest) === interest);

    return (
      <section className="section" id="grupos-interes">
        <div className="wrap">
          <div className="section-head with-meta">
            <div className="left">
              <div className="eyebrow">03 / Grupos de interés</div>
              <h2>{stakes.length} grupos identificados</h2>
            </div>
            <div className="desc">Distribución de los grupos de interés según poder e interés. Pasa el cursor sobre cada código para ver el detalle.</div>
            
          </div>
          <div className="stk-matrix-wrapper">

            <div className="stk-grid-matrix" aria-label="Matriz poder interés">
              <div className="stk-grid-corner">P \ I</div>
              {Array.from({length: gridSize}, (_, i) => <div key={`top-${i}`} className="stk-grid-head">{i+1}</div>)}
              {Array.from({length: gridSize}, (_, rowIdx) => {
                const power = gridSize - rowIdx;
                return [
                  <div key={`left-${power}`} className="stk-grid-head row">{power}</div>,
                  ...Array.from({length: gridSize}, (_, colIdx) => {
                    const interest = colIdx + 1;
                    const items = getCellStakes(power, interest);
                    const qClass = power >= 7 && interest >= 7 ? "strat-high"
                      : power >= 7 && interest < 7 ? "strat-midhigh"
                      : power < 7 && interest >= 7 ? "strat-neutral"
                      : "strat-low";
                    return (
                      <div key={`${power}-${interest}`} className={`stk-grid-cell ${qClass} ${items.length ? "filled" : "empty"}`}>
                        <div className="stk-cell-items">
                          {items.map(s => (
                            <div key={s.code} className="stk-badge" title={`${s.code} · ${s.name}\nPoder: ${s.power}/10 · Interés: ${s.interest}/10\n${s.role}\nComunicación: ${s.how}`}>
                              {getCode(s)}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })
                ];
              })}
            </div>
            <div className="stk-legend" style={{display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:16, marginTop:20}}>
              <div className="item"><div className="sw strat-high" style={{width:12,height:12,borderRadius:"50%",flexShrink:0}}/><div className="legend-text"><div className="t">Gestionar atentamente</div><div className="d">Alto Poder / Alto Interés</div></div></div>
              <div className="item"><div className="sw strat-midhigh" style={{width:12,height:12,borderRadius:"50%",flexShrink:0}}/><div className="legend-text"><div className="t">Mantener satisfecho</div><div className="d">Alto Poder / Bajo Interés</div></div></div>
              <div className="item"><div className="sw strat-neutral" style={{width:12,height:12,borderRadius:"50%",flexShrink:0}}/><div className="legend-text"><div className="t">Mantener informado</div><div className="d">Bajo Poder / Alto Interés</div></div></div>
              <div className="item"><div className="sw strat-low" style={{width:12,height:12,borderRadius:"50%",flexShrink:0}}/><div className="legend-text"><div className="t">Monitorear</div><div className="d">Bajo Poder / Bajo Interés</div></div></div>
            </div>
          </div>
        </div>
      </section>
    );
  }

  /* ── CONTACTO ── */
  function Contacto() {
    const [sent, setSent] = React.useState(false);
    function handleSubmit(e) {

      window.location.href = `mailto:directoresagrupados@upm.es?subject=Consulta de ${encodeURIComponent(f.uname.value)}&body=${encodeURIComponent(f.message.value + "\n\nRemitente: " + f.uname.value + " (" + f.email.value + ")")}`;

    const iStyle = {width:'100%', padding:'10px 14px', background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.15)', borderRadius:6, color:'white', fontSize:15, fontFamily:'inherit', outline:'none', boxSizing:'border-box'};
    const lStyle = {display:'block', fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.5)', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:6};
    return (
      <section className="contact-section" id="contacto">
        <div className="wrap">
          <div style={{marginBottom:40}}>
            <div style={{fontSize:11, fontWeight:700, color:'var(--lime)', letterSpacing:'0.14em', textTransform:'uppercase', marginBottom:8}}>Contacto</div>
            <h2 style={{fontFamily:'"Fraunces", Georgia, serif', fontSize:52, lineHeight:1.0, letterSpacing:'-0.02em', fontWeight:700, color:'white', marginBottom:10}}>Buzón de <span style={{color:'var(--lime)'}}>consultas</span></h2>
            <p style={{color:'rgba(255,255,255,0.6)', fontSize:17, maxWidth:580}}>Canales oficiales del portal, la dirección de obra y la comunicación con propietarios y usuarios.</p>
          </div>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:48, alignItems:'start'}}>
            <div>
              <div style={{fontSize:11, fontWeight:700, color:'rgba(255,255,255,0.4)', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:14}}>Organismos de contacto</div>
              <div style={{display:'flex', flexDirection:'column', gap:10}}>
                {[
                  {org:'MITMA', detail:'Paseo de la Castellana 67 · 900 200 300', url:'https://www.mitma.gob.es', label:'mitma.gob.es →'},
                  {org:'TYPSA', detail:'Carlos López Díaz · Soña Abajo González', url:'https://www.typsa.es', label:'typsa.es →'},
                  {org:'DGT — Información tráfico', detail:'011 · App DGT 3.0 · PMV en obra', url:'https://www.dgt.es', label:'dgt.es →'},
                  {org:'📄 Documentación oficial', detail:'Memorias, planos y pliegos de ambos proyectos', url:'https://contrataciondelestado.es', label:'Ver expediente →'},
                ].map((item, i) => (
                  <a key={i} href={item.url} target="_blank" rel="noopener noreferrer" style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:16, padding:'14px 18px', background:'rgba(255,255,255,0.07)', borderRadius:8, border:'1px solid rgba(255,255,255,0.1)', textDecoration:'none'}}>
                    <div>
                      <div style={{fontWeight:700, color:'white', fontSize:15}}>{item.org}</div>
                      <div style={{fontSize:13, color:'rgba(255,255,255,0.5)', marginTop:2}}>{item.detail}</div>
                    </div>
                    <span style={{color:'var(--lime)', fontSize:12, fontWeight:700, whiteSpace:'nowrap', flexShrink:0}}>{item.label}</span>
                  </a>
                ))}
              </div>
            </div>
            <div style={{background:'rgba(255,255,255,0.06)', border:'1px solid rgba(255,255,255,0.12)', borderRadius:12, padding:32}}>
              <div style={{fontSize:11, fontWeight:700, color:'var(--lime)', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:20}}>Formulario de consulta</div>
              {sent ? (
                <div style={{textAlign:'center', padding:'40px 0'}}>
                  <div style={{fontSize:32, marginBottom:12}}>✅</div>
                  <div style={{color:'white', fontWeight:700, fontSize:18, marginBottom:8}}>Consulta enviada</div>
                  <div style={{color:'rgba(255,255,255,0.5)', fontSize:14}}>Te responderemos en máx. 48 h laborables.</div>

                  <div><label style={lStyle}>Mensaje</label><textarea name="message" required rows={4} placeholder="Describe tu consulta..." style={{...iStyle, resize:'vertical'}}/></div>

                </form>
              )}

          </div>
        </div>

  /* ── APP ── */
  function App() {
    const [project, setProject] = React.useState("madrid");
    const [lightbox, setLightbox] = React.useState(null); // {src, title}
    function openVideo(src, title) { setLightbox({src, title}); }
    function closeVideo() { setLightbox(null); }

    function scrollToSection(id) {
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }
    function scrollToProjects() {
      const el = document.getElementById("proyectos");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }



    const p = D.projects[project];

    return (
      <>
        <Nav scrollToSection={scrollToSection} scrollToProjects={scrollToProjects} />
        <Hero scrollToProjects={scrollToProjects} />

        <div id="projects-area" key={project} style={{animation:"slideUp 0.35s ease"}}>
          <ProjectsBar project={project} setProject={setProject} />
          <ElProyecto p={p} onOpenVideo={openVideo} />
          <ComoTeAfecta p={p} scrollToSection={scrollToSection} />
          <GruposInteres p={p} />
          <EquipoOrganismos p={p} />
        </div>

        {lightbox && <VideoLightbox src={lightbox.src} title={lightbox.title} onClose={closeVideo} />}
        <PlanComunicaciones />
        <Contacto />
        <Footer scrollToSection={scrollToSection} scrollToProjects={scrollToProjects} />
      </>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();

</script>
